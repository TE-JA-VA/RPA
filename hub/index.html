<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옵저버(Stand Alone) 관제</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/hub.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><h1>옵저버(Stand Alone) 관제</h1><div class="co">ERPia 없이 쓰는 옵저버 단독 버전</div></div>
    <nav class="nav" id="nav">
      <a href="#now" data-view="now">현황</a>
      <a href="#presets" data-view="presets">프리셋</a>
      <a href="#schedule" data-view="schedule">예약</a>
      <a href="#history" data-view="history">기록</a>
      <a href="#settings" data-view="settings">설정</a>
    </nav>
    <div class="foot"><span class="who" id="host"></span></div>
  </aside>
  <main class="main">
    <div id="pc-problem" class="band bad hide"></div>
    <div id="otp-band" class="band warn hide"></div>

    <section id="view-now">
      <div class="top"><h2>현황</h2><div class="seg"><button id="stop-btn">중지</button></div></div>
      <div class="hero" id="hero" data-state="none">
        <div class="hero-main"><div class="hero-title" id="hero-title">실행 기록 없음</div><div class="hero-sub" id="hero-sub"></div></div>
        <div class="hero-side" id="hero-side"></div>
      </div>
      <div class="card">
        <h3>단계</h3>
        <div id="steps" class="steps muted">실행한 적이 없습니다.</div>
      </div>
      <div class="card">
        <h3>예약</h3>
        <div id="now-schedule" class="muted"></div>
        <div id="now-error" class="msg bad"></div>
      </div>
    </section>

    <section id="view-presets" class="hide">
      <div class="top"><h2>프리셋</h2>
        <div class="seg"><button id="run-btn">지금 실행</button><button id="observer-btn">옵저버 열기</button></div></div>
      <div class="card">
        <div class="msg" id="presets-note">선택한 프리셋만 실행합니다. 선택하지 않으면 켠 프리셋을 모두 실행합니다.</div>
        <div class="msg" id="presets-msg"></div>
        <div class="tbl"><table id="presets-table">
          <thead><tr><th></th><th>번호</th><th>이름</th><th>사이트코드</th><th>상태</th><th>마지막 결과</th><th>비고</th></tr></thead>
          <tbody></tbody>
        </table></div>
        <div id="presets-none" class="muted hide">저장된 프리셋이 없습니다. [옵저버 열기]로 기록한 뒤 저장하여 주십시오.</div>
      </div>
    </section>

    <section id="view-schedule" class="hide">
      <div class="top"><h2>예약</h2><div class="seg"><button id="sch-apply" class="apply" disabled>적용</button></div></div>
      <div class="card">
        <label class="switch first"><span>자동 실행<span class="why">정한 요일·시각에 프리셋을 실행합니다.</span></span><input type="checkbox" id="sch-enabled"><span class="knob"></span></label>
        <label class="switch"><span>공휴일 휴무 적용<span class="why" id="sch-off-note"></span></span><input type="checkbox" id="sch-holidays"><span class="knob"></span></label>
        <div class="lbl">실행 줄</div>
        <div class="times" id="sch-times"></div>
        <div class="seg"><button id="sch-add">+ 시각</button><button id="sch-add-win">+ 반복 시간대</button></div>
        <div class="msg" id="sch-info"></div>
        <div class="msg bad" id="sch-msg"></div>
      </div>
    </section>

    <section id="view-history" class="hide">
      <div class="top"><h2>기록</h2>
        <div class="seg" id="hist-period"><button data-p="7" aria-pressed="true">7일</button><button data-p="30">30일</button><button data-p="90">90일</button></div></div>
      <div class="tiles" id="hist-tiles"></div>
      <div class="card">
        <div class="tbl"><table id="hist-table">
          <thead><tr><th>언제</th><th>결과</th><th>프리셋</th><th>다운로드</th><th>상세</th><th></th></tr></thead>
          <tbody></tbody>
        </table></div>
        <div id="hist-none" class="muted hide">기간 안에 실행 기록이 없습니다.</div>
      </div>
    </section>

    <section id="view-settings" class="hide">
      <div class="top"><h2>설정</h2><div class="seg"><button id="set-apply" class="apply">적용</button></div></div>
      <div class="card">
        <label>받은 파일 폴더<input id="set-dir" autocomplete="off"><span class="why">ACTOR 가 다운로드한 파일을 (사이트코드)원래이름 으로 둡니다. 기본은 바탕화면\AI 입니다.</span></label>
        <label>동시 실행 창 수<input id="set-parallel" type="number" min="1" max="16" class="num"><span class="why" id="set-parallel-note"></span></label>
        <div class="msg" id="set-msg"></div>
      </div>
    </section>
  </main>
</div>
<script src="/hub.js"></script>
</body>
</html>
