# 오토파일럿 서버 옮기기 1단계 - 업체 웹 + 업데이트 파일 (정적 파일만, docs/server-move-stage1.md)
# 한 도메인에 둘 다: 업체 웹은 /, 업데이트는 /releases/·/blobs/ → server_info 의 DASHBOARD_URL = UPDATE_BASE_URL = https://<도메인>
# 넣을 곳: /etc/nginx/conf.d/autopilot.conf (http { } 안에 들어간다). 바꿀 곳은 <도메인> 과 인증서 경로 둘뿐.
#   /srv/autopilot/web            ← firebase/web 폴더 그대로
#   /srv/autopilot/releases_site  ← firebase/releases_site 폴더 그대로 (published.json 은 안 올려도 된다 - 여기서 안 보인다)

server {
    listen 80;
    server_name <도메인>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name <도메인>;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;   # 공인 인증서 (자체 서명이면 PC 가 업데이트를 못 받는다)
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/autopilot/web;
    index index.html;
    add_header Cache-Control "no-cache" always;           # Firebase Hosting 과 같게 - 고친 화면·새 버전이 바로 보인다

    location ~ /\. { return 404; }                        # 숨김 파일
    location /releases/ { root /srv/autopilot/releases_site; }
    location /blobs/    { root /srv/autopilot/releases_site; }
}
