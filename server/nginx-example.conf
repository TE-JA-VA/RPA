# 오토파일럿 사내 서버 앞에 nginx 를 세우는 예시 (업체 IT 가 프록시를 쓸 때만 - 쓰지 않으면 이 파일은 필요 없다)
# 두 모양 가운데 하나만 쓴다. server.json 의 칸은 lan_config 의 이름 그대로 (설치 안내서 참고).
# 에이전트 포트(8444)는 프록시 뒤에 두지 않는다 - PC 는 늘 서버의 8444 에 직접 TLS 로 붙는다.

# ---------------------------------------------------------------------------------------------
# (ㄱ) nginx 가 443 에서 TLS 를 받고, 서버 8443 으로 다시 TLS 로 넘긴다 (장비 사이에 평문 구간 없음)
#     server.json: "trusted_proxies": ["<nginx 주소>"]  (같은 장비면 "127.0.0.1")
#                  "public_web": ["autopilot.example.local"]   ← 브라우저가 여는 이름
# ---------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name autopilot.example.local;

    ssl_certificate     /etc/nginx/tls/autopilot.example.local.crt;     # 업체 인증서
    ssl_certificate_key /etc/nginx/tls/autopilot.example.local.key;

    location / {
        proxy_pass https://192.168.1.230:8443;
        proxy_ssl_trusted_certificate /var/lib/autopilot/tls/ca_cert.pem;   # 우리 인증 기관 공개 인증서 (사본을 nginx 가 읽을 자리에)
        proxy_ssl_verify on;
        proxy_ssl_name 192.168.1.230;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;                 # 현황 구독(/api/stream) 이 바로 흐르게
        proxy_read_timeout 1h;
    }
}

# ---------------------------------------------------------------------------------------------
# (ㄴ) 같은 장비의 nginx 가 TLS 를 끝내고 서버에 평문으로 넘긴다 (127.0.0.1 안에서만)
#     server.json: "web_plain": true, "trusted_proxies": ["127.0.0.1"], "public_web": ["autopilot.example.local"],
#                  "proxy_secret": "<32자 이상의 비밀 값 - 예: openssl rand -base64 48>"
#     (웹 포트는 이때 127.0.0.1 에만 듣는다 - 에이전트 포트 8444 는 listen 주소에 TLS 그대로)
#     nginx 설정 파일도 이 비밀 값을 담으므로 root 만 읽게 둔다 (chmod 600).
#     서버는 X-Autopilot-Proxy 머리글이 proxy_secret 과 같은 평문 요청만 받는다 (같은 장비의 다른 계정이 프록시 행세를 못 하게).
# ---------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name autopilot.example.local;

    ssl_certificate     /etc/nginx/tls/autopilot.example.local.crt;
    ssl_certificate_key /etc/nginx/tls/autopilot.example.local.key;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header X-Autopilot-Proxy <server.json 의 proxy_secret>;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
