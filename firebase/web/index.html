<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFTER MARKET</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --ink:#1c2024; --muted:#6b7280; --line:#e5e7eb; --ok:#15803d; --bad:#b91c1c; --run:#1d4ed8; --accent:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --card:#1c2024; --ink:#e8eaed; --muted:#9aa2ad; --line:#2c3238; --accent:#60a5fa; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:15px/1.5 "Malgun Gothic",system-ui,sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .row { display:flex; align-items:center; gap:8px; justify-content:space-between; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; letter-spacing:.04em; }
  h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; margin-bottom:8px; }
  input, select, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  input, select { width:100%; }
  input[type=checkbox] { width:auto; }
  button { cursor:pointer; }
  button[disabled] { opacity:.5; cursor:default; }
  .muted { color:var(--muted); }
  .hide { display:none !important; }   /* #app-nav 처럼 id 로 display 를 준 요소도 숨긴다 */
  .st-running { color:var(--run); } .st-success, .st-done { color:var(--ok); } .st-failed, .st-stopped { color:var(--bad); }
  .alert { border-radius:8px; padding:10px; margin-top:10px; border:1px solid var(--line); }
  .alert.bad { color:var(--bad); }
  ul.steps { list-style:none; padding:0; margin:8px 0 0; }
  ul.steps li { display:flex; justify-content:space-between; padding:4px 0; border-top:1px solid var(--line); }
  #mod-list label { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-top:1px solid var(--line); margin:0; }
  /* 앱 고르기 (앱이 둘 이상일 때만 보인다) */
  #app-nav { display:flex; gap:6px; margin-bottom:12px; }
  #app-nav button { border-radius:999px; padding:6px 14px; }
  #app-nav button[aria-current="page"] { border-color:var(--accent); color:var(--accent); font-weight:bold; }
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="card hide">
    <h1 style="margin-bottom:12px">AFTER MARKET</h1>
    <label>이메일 <input id="email" type="email" autocomplete="username"></label>
    <label>비밀번호 <input id="password" type="password" autocomplete="current-password"></label>
    <button id="login-btn">로그인</button>
    <div id="login-alert" class="alert bad hide"></div>
  </section>

  <section id="main" class="hide">
    <div class="card row">
      <div class="row" style="gap:12px">
        <h1>AFTER MARKET</h1>
        <span id="company" class="muted"></span>
      </div>
      <div class="row">
        <select id="pc-pick" class="hide" style="width:auto"></select>
        <span id="who" class="muted"></span>
        <button id="logout-btn">로그아웃</button>
      </div>
    </div>

    <nav id="app-nav" class="hide" aria-label="앱"></nav>

    <div id="app-root"></div>
  </section>

</div>
<script type="module" src="./app.js"></script>
</body>
</html>
