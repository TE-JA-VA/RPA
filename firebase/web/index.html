<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFTER MARKET</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 밝음: Solarized light (base3 바탕 / base2 면). 회색 글자는 대비 4.5:1 이 되게 Solarized 보다 진하게.
     어두움: Solarized 대신 중립 어두운 색 (Solarized dark 는 글자 대비가 2.5:1 로 낮다).
     강조는 cyan 하나(사용자가 바꿀 수 있다). 상태 색(green·yellow·red·blue)은 강조와 분리한다.
     --on-*: 상태 색으로 채운 카드 위 글자색. 밝은 채움(초록·노랑)엔 어두운 글자, 진한 채움(빨강·파랑)엔 밝은 글자. */
  /* 2026-09-22 팔레트(StarAdmin 예시, 사용자 제공): 주 색 주황 #f29f67 · 남색 #1e1e2c, 보조 파랑 #3b8ff3 · 청록 #34b1aa · 노랑 #e0b50f.
     바탕은 사용자 지정: 밝음 #fdf6e3, 어두움 #002b36 (Solarized). 주황 = 강조색(양쪽 모드 같음), 남색 = 밝은 모드 진한 글자 + 강조색 위 글자.
     청록 = 성공, 파랑 = 진행, 노랑 = 오류, 빨강(팔레트 밖) = 실패. 밝은 모드에서 글자로 쓰는 상태색은 카드 위 4.5:1 이 되게 진하게. */
  :root {
    --bg:#fdf6e3; --card:#fffdf6; --soft:#eee8d5; --ink:#3d3d4d; --strong:#1e1e2c; --muted:#6e6e80; --line:#e6dfc8;
    --accent:#f29f67; --accent-ink:#1e1e2c;
    --good:#1a7f79; --warn:#8f7200; --bad:#c93b36; --run:#2a6fc4;
    --good-fill:#1b7f79; --warn-fill:#856a00; --bad-fill:#c92b22; --run-fill:#2a6fc4; --on-fill:#ffffff;
    --good-bg:#d9f1ef; --warn-bg:#f9efc4; --bad-bg:#fadcd9; --run-bg:#dae9fb;
    --warn-pill:#e0b50f; --warn-pill-ink:#1e1e2c;   /* 기록 표의 오류 알약. 밝은 모드는 밝은 노랑에 남색 글자 */
    /* 도넛 호·범례처럼 글자가 아닌 표시용 노랑. --warn 은 글자라 대비 4.5:1 을 맞추느라 올리브색이 되어 초록·빨강 옆에서 탁해 보인다 */
    --warn-mark:#e0b50f;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#002b36; --card:#073642; --soft:#0f4553; --ink:#dbe3e3; --strong:#fdf6e3; --muted:#9cb0b0; --line:#1b4f5c;
    --accent:#f29f67; --accent-ink:#1e1e2c;
    --good:#34b1aa; --warn:#e0b50f; --bad:#f57a72; --run:#5aa2f5;
    --good-fill:#1b7f79; --warn-fill:#856a00; --bad-fill:#c92b22; --run-fill:#2a6fc4; --on-fill:#ffffff;
    --good-bg:#0f4a48; --warn-bg:#4a3f0a; --bad-bg:#4a2220; --run-bg:#123a5c;
    --warn-pill:#705a00; --warn-pill-ink:#fdf6e3;   /* 어두운 모드는 짙은 올리브에 크림 글자 */
    --warn-mark:#e0b50f;
  } }
  :root[data-theme="dark"] {
    --bg:#002b36; --card:#073642; --soft:#0f4553; --ink:#dbe3e3; --strong:#fdf6e3; --muted:#9cb0b0; --line:#1b4f5c;
    --accent:#f29f67; --accent-ink:#1e1e2c;
    --good:#34b1aa; --warn:#e0b50f; --bad:#f57a72; --run:#5aa2f5;
    --good-fill:#1b7f79; --warn-fill:#856a00; --bad-fill:#c92b22; --run-fill:#2a6fc4; --on-fill:#ffffff;
    --good-bg:#0f4a48; --warn-bg:#4a3f0a; --bad-bg:#4a2220; --run-bg:#123a5c;
    --warn-pill:#705a00; --warn-pill-ink:#fdf6e3;
    --warn-mark:#e0b50f;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  :root { --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--font); }
  .num { font-variant-numeric:tabular-nums; }   /* 서체는 하나(Pretendard). 숫자만 고정폭으로 */
  pre { font-family:var(--font); font-variant-numeric:tabular-nums; }
  h1, h2, .strong { color:var(--strong); }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--strong); padding:9px 14px; }
  button[disabled] { opacity:.45; cursor:default; }
  input, select { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--strong); width:100%; }
  input[type=checkbox] { width:auto; }
  button:focus-visible, input:focus-visible, .switch input:focus-visible + span, .nav a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .muted { color:var(--muted); }
  .hide { display:none !important; }
  label { display:block; margin-bottom:8px; }

  /* 로그인 */
  #login { max-width:380px; margin:10vh auto 0; padding-inline:16px; }
  #login h1 { font-size:16px; letter-spacing:.14em; margin:0 0 14px; }
  #login .login-row { display:flex; align-items:center; gap:12px; }
  #login-alert { color:var(--bad); font-weight:600; }   /* 로그인 버튼 오른쪽, 빨간 글씨 */

  /* 뼈대: 사이드바 + 본문 */
  .shell { display:flex; min-height:100%; }
  .side { width:220px; flex:none; border-right:1px solid var(--line); background:var(--card); padding:18px 12px; display:flex; flex-direction:column; gap:18px;
          position:sticky; top:0; height:100vh; align-self:flex-start; }
  .brand { padding:4px 8px; }
  .brand h1 { margin:0; font-size:15px; letter-spacing:.14em; }
  .brand .co { font-size:13px; color:var(--muted); }
  .nav { display:grid; gap:2px; }
  .nav .sec { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:8px 8px 4px; }
  .nav a { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:var(--ink); text-decoration:none; cursor:pointer; }
  .nav a[aria-current="page"] { background:var(--accent); color:var(--accent-ink); font-weight:500; }
  .nav a .ic { width:18px; text-align:center; }
  .side .foot { margin-top:auto; display:grid; gap:8px; padding:0 4px; font-size:13px; }
  .side .foot .who { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side .foot .row { display:flex; gap:8px; }
  .side .foot button { flex:1; padding:7px 10px; font-size:13px; }
  .main { flex:1; min-width:0; padding:20px 24px 32px; }
  .main .top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .main .top h2 { margin:0; font-size:20px; }
  /* PC 고르기 (사용자가 준 예시 방식): 올리거나 누르면 목록이 아래로 미끄러져 나온다. 지금 고른 PC 는 목록에 없다.
     색은 카드·선·연한 바탕 토큰을 그대로 써서 밝음·어두움 양쪽에 맞는다 */
  .pc-pick { position:relative; width:fit-content; font-size:14px; }
  .pc-pick::after { content:""; position:absolute; left:0; right:0; top:100%; height:8px; }   /* 알약과 목록 사이 틈을 건너도 hover 가 안 끊기게 */
  .pc-pick .selected { display:flex; align-items:center; gap:10px; padding:6px 10px 6px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--card); color:var(--strong); cursor:pointer; font:inherit; }
  .pc-pick .chev { width:12px; height:12px; fill:currentColor; transform:rotate(-90deg); transition:transform .3s; }
  .pc-pick .options { position:absolute; right:0; top:calc(100% + 6px); min-width:100%; display:flex; flex-direction:column; gap:2px; padding:5px;
    border-radius:10px; background:var(--card); border:1px solid var(--line); box-shadow:0 10px 24px rgba(0,0,0,.14);
    opacity:0; transform:translateY(-8px); pointer-events:none; transition:opacity .3s, transform .3s; z-index:20; }
  .pc-pick:hover .options, .pc-pick:focus-within .options, .pc-pick.open .options { opacity:1; transform:none; pointer-events:auto; }
  .pc-pick:hover .chev, .pc-pick:focus-within .chev, .pc-pick.open .chev { transform:rotate(0); }
  .pc-pick .option { text-align:left; border:0; border-radius:7px; padding:7px 12px; background:transparent; color:var(--ink); white-space:nowrap;
    cursor:pointer; font:inherit; transition:background .3s; }
  .pc-pick .option:hover, .pc-pick .option:focus-visible { background:var(--soft); color:var(--strong); }
  @media (max-width:760px) {
    .shell { display:block; }
    .side { width:auto; border-right:0; border-bottom:1px solid var(--line); flex-direction:row; align-items:center; flex-wrap:wrap; gap:10px; padding:10px 12px; position:static; height:auto; }
    .nav { display:flex; gap:4px; } .nav .sec { display:none; }
    .side .foot { margin:0 0 0 auto; }
    .main { padding:16px; }
  }

  /* 상태 헤더: 상태 색으로 통째로 채운 카드 하나. 나머지 카드는 비운다 */
  /* 성공 초록 / 진행 중 파랑 / 실패(중단) 빨강 / 오류(비정상 종료·연결 끊김) 노랑 */
  /* 채움은 상태 색보다 한 단계 진한 --*-fill (흰 글자로 4.5:1 이상) */
  .hero { border-radius:18px; margin-bottom:14px; background:var(--soft); color:var(--strong); overflow:hidden; --on:var(--strong);
          display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .hero[data-state="success"] { background:var(--good-fill); --on:var(--on-fill); }
  .hero[data-state="stopped"], .hero[data-state="failed"] { background:var(--bad-fill); --on:var(--on-fill); }
  .hero[data-state="crashed"], .hero[data-state="offline"] { background:var(--warn-fill); --on:var(--on-fill); }
  .hero[data-state="running"] { background:var(--run-fill); --on:var(--on-fill); }
  .hero .body { padding:22px 24px; display:grid; gap:4px; min-width:0; flex:1 1 320px; color:var(--on); }
  /* 연결·다음 자동 실행은 상태 띠 오른쪽에. 띠 색 위라 글자색은 --on 을 따른다 */
  .hero .stats { display:grid; gap:12px; padding:18px 24px; color:var(--on); flex:none; }
  .hero .stats .stat { display:grid; gap:2px; text-align:right; }
  .hero .stats .k { font-size:12px; letter-spacing:.04em; opacity:.8; }
  .hero .stats .v { font-size:18px; font-weight:600; white-space:nowrap; }
  .hero .state { display:flex; align-items:center; gap:10px; font-weight:700; font-size:24px; color:var(--on); }
  .hero .dot { width:12px; height:12px; border-radius:50%; background:var(--on); flex:none; opacity:.9; }
  /* 진행 중이면 상태 카드 점도 같이 숨쉰다 (카드는 색으로 채워져 있어 흰 빛무리로) */
  .hero[data-state="running"] .dot { animation:hero-glow 1.4s ease-in-out infinite; }
  @keyframes hero-glow {
    0%, 100% { opacity:.6; box-shadow:0 0 0 0 color-mix(in srgb, var(--on) 45%, transparent); }
    50% { opacity:1; box-shadow:0 0 10px 3px color-mix(in srgb, var(--on) 45%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .hero[data-state="running"] .dot { animation:none; } }
  .hero .line1 { font-size:15px; }
  .hero .line2 { font-size:14px; overflow-wrap:anywhere; opacity:.85; }
  .hero[data-state="running"] .line2 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }   /* "01:05 | 긴 단계 이름…" */
  .primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:500; }

  /* 강조색 고르기 */
  .swatches { display:flex; gap:8px; flex-wrap:wrap; }
  .swatch { width:34px; height:34px; border-radius:50%; border:2px solid transparent; padding:0; }
  .swatch[aria-pressed="true"] { border-color:var(--strong); box-shadow:0 0 0 2px var(--card) inset; }
  input[type=color] { width:44px; height:34px; padding:2px; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:14px; margin-block:14px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:grid; gap:2px; }
  .tile .k { font-size:12px; color:var(--muted); letter-spacing:.04em; }
  .tile .v { font-size:22px; font-weight:500; color:var(--strong); }
  .tile .v small { font-size:13px; color:var(--muted); font-weight:400; margin-left:3px; }
  .tile .v .approx { color:var(--muted); font-weight:400; }

  .cols { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; align-items:start; }
  .cols:has(> #sidecol.hide) { grid-template-columns:minmax(0,1fr); }   /* 오른쪽 열이 숨으면 자리도 안 남긴다 */
  @media (max-width:1000px) { .cols { grid-template-columns:minmax(0,1fr); } }   /* 1fr 이면 띠 내용 폭에 카드가 늘어난다 */
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .card + .card { margin-top:14px; }
  .card h2 { margin:0 0 10px; font-size:14px; font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card h2 .muted { font-weight:400; font-size:13px; }
  /* --- 토스트 알림: 카드 안에 상자를 남기지 않고 오른쪽 아래에 잠깐 뜬다 ---- */
  .toasts { position:fixed; right:18px; bottom:18px; z-index:60; display:grid; gap:8px;
            width:min(360px, calc(100vw - 36px)); }
  .toast { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px;
           border:1px solid var(--line); border-left:4px solid var(--tone); background:var(--tone-bg);
           color:var(--strong); font-size:13px; font-weight:600; line-height:1.45; cursor:pointer;
           box-shadow:0 6px 20px rgb(0 0 0 / .12); animation:toast-in .25s ease-out; }
  .toast:hover { transform:translateY(-1px); }
  .toast.out { animation:toast-out .2s ease-in forwards; }
  .toast svg { width:18px; height:18px; flex:none; color:var(--tone); }
  .toast .x { margin-left:auto; color:var(--muted); font-size:14px; }
  /* 알약·상태 칸이 쓰는 바탕색 토큰을 그대로 쓴다 (밝음·어두움이 이미 맞춰져 있다) */
  .toast.ok   { --tone:var(--good); --tone-bg:var(--good-bg); }
  .toast.info { --tone:var(--run);  --tone-bg:var(--run-bg); }
  .toast.warn { --tone:var(--warn); --tone-bg:var(--warn-bg); }
  .toast.bad  { --tone:var(--bad);  --tone-bg:var(--bad-bg); }
  @keyframes toast-in  { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:none; } }
  @keyframes toast-out { to { opacity:0; transform:translateX(16px); } }
  @media (prefers-reduced-motion: reduce) { .toast, .toast.out { animation:none; } .toast:hover { transform:none; } }
  /* 아이폰: 홈 표시줄·아래 주소창에 가리지 않게 안전 영역만큼 띄운다 */
  @media (max-width: 720px) { .toasts { right:12px; left:12px; width:auto;
    bottom:calc(12px + env(safe-area-inset-bottom, 0px)); } }
  .msg { font-size:13px; color:var(--muted); margin-top:8px; min-height:1.2em; }
  .msg.bad { color:var(--bad); }

  details summary { cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:14px; color:var(--strong); }
  details summary::-webkit-details-marker { display:none; }
  details summary .chev { color:var(--muted); font-size:12px; transition:transform .15s; }
  details[open] summary .chev { transform:rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { details summary .chev, .switch span.knob, .switch span.knob::after { transition:none; } }
  ul.steps { list-style:none; margin:10px 0 0; padding:0; }
  ul.steps li { display:grid; grid-template-columns:18px auto minmax(0, 1fr); gap:10px; align-items:center; padding:6px 0; border-top:1px solid var(--line); font-size:14px; }
  ul.steps li .mark { width:10px; height:10px; border-radius:50%; background:var(--line); justify-self:center; }
  ul.steps li.done .mark { background:var(--good); }
  ul.steps li.stopped .mark, ul.steps li.failed .mark { background:var(--bad); }
  ul.steps li.running .mark { background:var(--run); box-shadow:0 0 0 3px var(--run-bg); }
  /* 진행 중인 단계만 숨쉬듯 빛난다. 목록은 제자리에서 고쳐 그려야 (rpa.js paintStepsInto) 이 애니메이션이 끊기지 않는다 */
  ul.steps li.running .mark { animation:step-glow 1.4s ease-in-out infinite; }
  @keyframes step-glow {
    0%, 100% { box-shadow:0 0 0 2px var(--run-bg), 0 0 0 0 color-mix(in srgb, var(--run) 55%, transparent); }
    50% { box-shadow:0 0 0 3px var(--run-bg), 0 0 8px 3px color-mix(in srgb, var(--run) 55%, transparent); } }
  @media (prefers-reduced-motion: reduce) { ul.steps li.running .mark { animation:none; } }   /* 움직임 줄이기 설정이면 멈춘다 */
  ul.steps li.skipped, ul.steps li.pending { color:var(--muted); }
  ul.steps li .note { color:var(--muted); font-size:13px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  ul.steps li.stopped .note, ul.steps li.failed .note { color:var(--bad); }

  /* 실행 버튼: 초록으로 채운 네모. 마우스를 올리면 글자는 오른쪽으로 밀려 사라지고
     표시가 버튼 한가운데로 옮겨 간다 (Uiverse 'Send' 꼴에서 흔들림·회전은 뺐다).
     표시는 자리로 잡아 두어 네 버튼(화살표·전원 ⏼) 모두 같은 자리에 선다 */
  .actions { display:grid; gap:8px; }
  .actions button { --fill:var(--good-fill); --ink:var(--on-fill);
    position:relative; display:flex; align-items:center; width:100%;
    padding:.7em 1em .7em 2.6em; border:0; border-radius:12px;
    background:var(--fill); color:var(--ink); font:inherit; font-size:14px; font-weight:700;
    text-align:left; overflow:hidden; transition:background-color .2s, transform .1s; }
  .actions button .fly { position:absolute; left:.9em; top:50%; translate:0 -50%;
    transition:left .3s ease-in-out, translate .3s ease-in-out; }
  /* 전원 글자(⏼ U+23FC)는 본문 글꼴에 없어서 기호 글꼴이 그린다. 윈도우 Segoe UI Symbol, 안드로이드 Noto, 애플 Apple Symbols */
  .actions button svg, .actions button .ic { display:block; width:18px; height:18px;
    font-size:16px; line-height:18px; text-align:center;
    font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols",sans-serif;
    transform-origin:center; transition:transform .3s ease-in-out; }
  .actions button .t { display:block; color:inherit; line-height:1.5;
    transition:transform .3s ease-in-out, opacity .3s ease-in-out; }
  .actions button:hover:not(:disabled) { background:color-mix(in srgb, var(--fill) 85%, #000); }
  .actions button:hover:not(:disabled) .fly { left:50%; translate:-50% -50%; }
  .actions button:hover:not(:disabled) svg, .actions button:hover:not(:disabled) .ic { transform:scale(1.12); }
  .actions button:hover:not(:disabled) .t { transform:translateX(9em); opacity:0; }
  .actions button:active:not(:disabled) { transform:scale(.97); }
  .actions button:disabled { opacity:.45; cursor:default; }
  /* 전체 실행은 더 진한 초록, 종료는 빨강으로 떨어뜨려 다른 묶음으로 읽히게 */
  .actions button.primary { --fill:color-mix(in srgb, var(--good-fill) 62%, #06231f); }
  .actions button.danger { --fill:var(--bad-fill); margin-top:6px; }
  @media (prefers-reduced-motion: reduce) {
    .actions button .fly, .actions button svg, .actions button .ic, .actions button .t { transition:none; } }
  .switch { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); gap:10px; margin:0; }
  .switch.first { border-top:0; }
  .switch input { position:absolute; opacity:0; width:0; height:0; }
  .switch span.knob { width:40px; height:22px; border-radius:999px; background:var(--line); position:relative; flex:none; transition:background .15s; }
  .switch span.knob::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:var(--card); transition:transform .15s; }
  .switch input:checked + .knob { background:var(--accent); }
  .switch input:checked + .knob::after { transform:translateX(18px); }
  .switch input:disabled + .knob { opacity:.4; }
  .apply { margin-top:10px; width:100%; }

  /* 현황 / 기록 */
  .subnav { display:flex; gap:6px; margin-bottom:12px; }
  .subnav button { border-radius:999px; padding:6px 16px; }
  .subnav button[aria-selected="true"] { border-color:var(--accent); color:var(--accent); font-weight:700; }

  /* 최근 20일: 날짜별 도넛 + 오늘 도넛 */
  /* 띠는 20일을 다 그리고 15칸까지만 보인다 - 나머지는 가로 스크롤. 칸 크기(--cell 48~72px)와 간격(--sgap)은 rpa.js 가
     남는 폭에 15칸이 꼭 맞게 정한다. 오늘 도넛은 오른쪽 고정, 띠는 왼쪽 끝부터 도넛까지 채운다 */
  .recent-body { display:flex; gap:20px; align-items:center; }
  .strip { display:flex; gap:var(--sgap, 6px); flex:1 1 auto; min-width:0; flex-wrap:nowrap;
    overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; scrollbar-color:var(--line) transparent; overscroll-behavior-x:contain; }
  .donut { flex:none; padding-left:20px; border-left:1px solid var(--line); }
  .strip .day { flex:none; width:var(--cell, 48px); display:grid; gap:2px; justify-items:center; font-size:11px; color:var(--muted); padding:4px 2px; border:0; background:none; border-radius:8px; }
  .strip .day svg { width:calc(var(--cell, 48px) - 4px); height:auto; }
  .strip .day:hover:not(.empty) { background:var(--soft); }
  .strip .day.empty { cursor:default; opacity:.6; }
  .strip .day:last-child svg { border-radius:50%; box-shadow:0 0 0 2px var(--accent); }
  .strip .day .d { font-variant-numeric:tabular-nums; }
  .donut { display:flex; align-items:center; gap:14px; }
  .donut svg { flex:none; }
  .legend { display:grid; gap:4px; font-size:13px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  @media (max-width:640px) {
    .recent-body { flex-direction:column; align-items:stretch; }
    .strip { flex:none; }
    .donut { justify-content:center; margin-left:0; border-left:0; padding-left:0; border-top:1px solid var(--line); padding-top:12px; }
  }

  /* 기록 표 */
  /* 기록 표: 시각·프로그램·결과·소요는 한 줄로 두고(줄바꿈 금지), 남는 폭은 전부 '처리' 칸이 쓴다. 좁으면 표가 옆으로 스크롤 */
  .tbl { overflow-x:auto; }
  tr.hist { cursor:pointer; }
  tr.hist td:nth-child(-n+4), thead th:nth-child(-n+4) { white-space:nowrap; }
  tr.hist td:nth-child(5), thead th:nth-child(5) { width:100%; min-width:220px; }   /* 좁으면 한 글자씩 세로로 내려가지 않게 */
  tr.hist:hover td { background:var(--soft); }
  tr.hist-detail td { background:var(--soft); padding:10px 12px; }
  tr.hist-detail pre { font-size:12px; white-space:pre-wrap; margin:10px 0 0; color:var(--muted); max-height:320px; overflow:auto; }
  /* 프리페어·루틴 나란히 */
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .pair .card { margin-top:0; }
  @media (max-width:640px) { .pair { grid-template-columns:1fr; } }
  .pair + .card { margin-top:12px; }

  /* 자동 실행 편집 */
  .seg { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .seg button { padding:5px 9px; font-size:13px; border-radius:999px; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .times { display:grid; gap:6px; margin-top:6px; }
  .times .t { display:flex; gap:6px; align-items:center; }
  .times input[type=time] { width:auto; }
  .times .t button { padding:5px 9px; font-size:13px; }
  .lbl { font-size:12px; color:var(--muted); margin-top:10px; letter-spacing:.04em; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-weight:500; color:var(--muted); font-size:12px; letter-spacing:.04em; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:500; white-space:nowrap; }
  .pill.good { background:var(--good-bg); color:var(--good); }
  .pill.bad { background:var(--bad-bg); color:var(--bad); }
  .pill.crash { background:var(--warn-pill); color:var(--warn-pill-ink); }   /* 비정상 종료 = 오류(노랑). 채워서 중단(옅은 빨강)과 구분 */
  .pill.run { background:var(--run-bg); color:var(--run); }
  .narrow { max-width:420px; }
</style>
</head>
<body>
